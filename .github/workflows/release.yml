name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    name: Signed APK + GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Check tag matches version.properties
        run: |
          V="$(grep majorVersion version.properties | cut -d= -f2).$(grep minorVersion version.properties | cut -d= -f2).$(grep patchVersion version.properties | cut -d= -f2)"
          [ "v$V" = "${GITHUB_REF_NAME}" ] || { echo "Tag ${GITHUB_REF_NAME} does not match version.properties (v$V)"; exit 1; }

      - name: Decode keystore
        env:
          KS: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          [ -n "$KS" ] || { echo "Missing secret RELEASE_KEYSTORE_BASE64"; exit 1; }
          echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "RELEASE_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Unit tests + release build
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew testReleaseUnitTest assembleRelease --stacktrace

      - name: Release notes from CHANGELOG
        run: |
          awk "/^## \\[${GITHUB_REF_NAME#v}\\]/{f=1;next} /^## \\[/{f=0} f" CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "See CHANGELOG.md" > notes.md

      - name: SHA-256 checksum
        run: cd app/build/outputs/apk/release && sha256sum *.apk > SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          name: Performance Monitor AAOBD ${{ github.ref_name }}
          body_path: notes.md
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/SHA256SUMS.txt
